<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomBook</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 0; } h2 { margin-top: 2rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
    label { display: flex; flex-direction: column; font-size: .85rem; }
    input, select, button { padding: .4rem .6rem; font: inherit; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #ddd; }
    #message { min-height: 1.5rem; color: #b00020; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>RoomBook</h1>
  <p>Meeting-room booking for the whole office.</p>
  <div id="message"></div>

  <section id="auth">
    <h2>Sign in</h2>
    <form id="login-form">
      <label>Name (register only) <input id="name"></label>
      <label>Email <input id="email" type="email" required></label>
      <label>Password <input id="password" type="password" required></label>
      <button type="submit">Log in</button>
      <button type="button" id="register">Register</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <p><button id="logout">Log out</button></p>

    <h2>Rooms</h2>
    <table id="rooms"><thead><tr><th>Room</th><th>Capacity</th><th>Per hour</th></tr></thead><tbody></tbody></table>

    <h2>Book a room</h2>
    <form id="book-form">
      <label>Room <select id="room"></select></label>
      <label>Start <input id="start" type="datetime-local" step="1800" required></label>
      <label>End <input id="end" type="datetime-local" step="1800" required></label>
      <label>Attendees <input id="attendees" type="number" min="1" value="2" required></label>
      <button type="submit">Book</button>
    </form>

    <h2>My bookings</h2>
    <form id="filter-form">
      <label>Day <input id="filter-date" type="date"></label>
      <button type="submit">Filter</button>
    </form>
    <table id="bookings"><thead><tr><th>Room</th><th>Start</th><th>End</th><th>People</th><th>Price</th><th></th></tr></thead><tbody></tbody></table>
  </section>

  <script src="app.js"></script>
</body>
</html>
